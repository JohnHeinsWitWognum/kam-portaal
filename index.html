<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d3247">
<meta name="robots" content="noindex">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Wit Wognum Portaal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: smalle kolom, header met projectstrook, knoppen gegroepeerd per KAM-categorie */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --field: #f8fafb;
  --ink: #17222e;
  --muted: #5b6977;
  --line: #d9dfe5;
  --accent: #d9611c;
  --accent-ink: #ffffff;
  --head: #1d3247;
  --head-ink: #f3f5f7;
  --req: #c0262d;
  --ok: #2f7a3e;
  --cat-inc: #c2410c;
  --cat-insp: #1f6f8b;
  --cat-ovl: #4d7c3a;
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10171e; --surface: #18222c; --field: #121a22; --ink: #e6ebf0; --muted: #98a6b3; --line: #2a3744;
    --accent: #ee7a37; --accent-ink: #10171e; --head: #0b1117; --head-ink: #e6ebf0; --req: #f07178; --ok: #7cc48a;
    --cat-inc: #f08a55; --cat-insp: #5fb3cf; --cat-ovl: #8cc471; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10171e; --surface: #18222c; --field: #121a22; --ink: #e6ebf0; --muted: #98a6b3; --line: #2a3744;
  --accent: #ee7a37; --accent-ink: #10171e; --head: #0b1117; --head-ink: #e6ebf0; --req: #f07178; --ok: #7cc48a;
  --cat-inc: #f08a55; --cat-insp: #5fb3cf; --cat-ovl: #8cc471; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--head); }

header { background: var(--head); color: var(--head-ink); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header .wrap { padding-block: 28px 24px; display: grid; gap: 6px; }
.brand { font-family: var(--font-display); font-stretch: 85%; font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h1 { margin: 0; font-family: var(--font-display); font-stretch: 80%; font-weight: 800; font-size: clamp(28px, 6vw, 40px); line-height: 1.05; text-wrap: balance; }
.sub { margin: 0; color: color-mix(in srgb, var(--head-ink) 72%, transparent); max-width: 52ch; }
.stripe { height: 6px; background: repeating-linear-gradient(-45deg, var(--accent) 0 14px, var(--head) 14px 28px); }

main .wrap { padding-block: 24px 40px; display: grid; gap: 28px; }
section { display: grid; gap: 10px; }
h2 { margin: 0; display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-stretch: 85%; font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
h2::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--c); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }

.tile { appearance: none; font: inherit; color: inherit; text-align: left; cursor: pointer;
  display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 12px 14px;
  background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 6px;
  transition: transform .12s ease, border-color .12s ease; }
.tile:hover { border-color: var(--c); transform: translateY(-1px); }
.tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.tile .name { flex: 1; min-width: 0; font-weight: 600; font-size: 16px; line-height: 1.25; }
.tile .meta { font-size: 12px; color: var(--muted); font-weight: 500; }
.tile .arrow { color: var(--c); font-family: var(--font-display); font-weight: 700; font-size: 20px; }

/* Startpagina */
.hubgrid { display: grid; gap: 12px; }
.hubtile { appearance: none; font: inherit; color: inherit; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 16px; min-height: 88px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 8px; transition: transform .12s ease, border-color .12s ease; }
.hubtile:hover { border-color: var(--c); transform: translateY(-1px); }
.hubtile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.hubicon { flex: none; width: 48px; height: 48px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
.hubicon svg { width: 26px; height: 26px; }
.hubtxt { flex: 1; min-width: 0; display: grid; gap: 2px; }
.hubtxt .name { font-family: var(--font-display); font-stretch: 85%; font-weight: 800; font-size: 20px; line-height: 1.15; }
.hubtxt .meta { font-size: 13px; color: var(--muted); }
.hubtile .arrow { color: var(--c); font-family: var(--font-display); font-weight: 700; font-size: 24px; }
@media (prefers-reduced-motion: reduce) { .hubtile { transition: none; } .hubtile:hover { transform: none; } }

/* Formulier */
.view { display: grid; gap: 16px; }
.back { appearance: none; font: inherit; justify-self: start; cursor: pointer; background: none; border: 0; padding: 6px 0; color: var(--accent); font-weight: 600; }
.back:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.titlebar { display: grid; gap: 2px; }
.titlebar .cat { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--c); font-weight: 600; }
.titlebar h3 { margin: 0; font-family: var(--font-display); font-stretch: 85%; font-weight: 800; font-size: 28px; line-height: 1.1; }
.titlebar p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.req-mark { color: var(--req); font-weight: 700; }

form { display: grid; gap: 16px; }
fieldset { margin: 0; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 6px; padding: 16px; display: grid; gap: 16px; }
fieldset.kam { border-top-color: var(--muted); }
legend { float: left; width: 100%; padding: 0; margin: 0; font-family: var(--font-display); font-stretch: 85%; font-weight: 700; font-size: 18px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
legend + * { clear: both; }
.badge { font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--field); border: 1px solid var(--line); color: var(--muted); }

.field { display: grid; gap: 6px; min-width: 0; }
.field label, .field .label { font-weight: 600; font-size: 14px; }
.field .hint { font-size: 12px; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 520px) { .row2 { grid-template-columns: 1fr; } }

input[type=text], input[type=date], textarea, select {
  width: 100%; font: inherit; color: var(--ink); background: var(--field);
  border: 1px solid var(--line); border-radius: 5px; padding: 10px 12px; min-height: 44px;
}
textarea { resize: vertical; line-height: 1.45; }
input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.field.invalid input, .field.invalid textarea { border-color: var(--req); }
.field .err { color: var(--req); font-size: 12px; font-weight: 600; }

.person { position: relative; }
.person input { padding-left: 38px; }
.person svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }

.upload { display: grid; gap: 10px; }
.upload label.drop { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; padding: 12px; border: 1.5px dashed var(--line); border-radius: 6px; background: var(--field); cursor: pointer; font-weight: 600; color: var(--muted); text-align: center; }
.upload label.drop:hover { border-color: var(--c); color: var(--ink); }
.upload input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.upload input[type=file]:focus-visible + label.drop { outline: 3px solid var(--accent); outline-offset: 2px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.thumb { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); background: var(--field); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: color-mix(in srgb, var(--head) 85%, transparent); color: var(--head-ink); cursor: pointer; font-size: 15px; line-height: 1; }

.choices { display: flex; flex-wrap: wrap; gap: 8px; border: 0; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.choice span { display: inline-flex; align-items: center; min-height: 44px; padding: 8px 18px; border: 1px solid var(--line); border-radius: 6px; background: var(--field); cursor: pointer; font-weight: 600; }
.choice input:checked + span { background: var(--c); border-color: var(--c); color: var(--accent-ink); }
.choice input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.field.invalid .choice span, .field.invalid .drop { border-color: var(--req); }
.field.cond { padding-left: 14px; border-left: 3px solid var(--line); }
input[type=number] { width: 100%; max-width: 160px; font: inherit; color: var(--ink); background: var(--field); border: 1px solid var(--line); border-radius: 5px; padding: 10px 12px; min-height: 44px; }
.notice { padding: 12px 14px; border-radius: 6px; border: 1px solid var(--req); background: color-mix(in srgb, var(--req) 10%, var(--surface)); color: var(--ink); font-size: 15px; }
.notice strong { color: var(--req); }
.choice.check span::before { content: ""; width: 14px; height: 14px; margin-right: 8px; border: 1.5px solid currentColor; border-radius: 3px; opacity: .6; }
.choice.check input:checked + span::before { opacity: 1; background: currentColor; box-shadow: inset 0 0 0 2px var(--c); }
.kamreq { font-size: 11px; font-weight: 600; color: var(--muted); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { appearance: none; font: inherit; font-weight: 600; cursor: pointer; min-height: 46px; padding: 10px 20px; border-radius: 6px; border: 1px solid transparent; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.pdfpanel { display: grid; gap: 10px; padding: 14px; border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 6px; background: var(--surface); }
.pdfinfo { display: grid; gap: 2px; min-width: 0; }
.pdfinfo strong { color: var(--ok); }
.pdfinfo span { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.btn:disabled { opacity: .55; cursor: progress; }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.formerr { color: var(--req); font-weight: 600; font-size: 14px; }

/* Overzicht na indienen */
.done { background: var(--surface); border: 1px solid var(--line); border-top: 4px solid var(--ok); border-radius: 6px; padding: 16px; display: grid; gap: 14px; }
.done h4 { margin: 0; font-family: var(--font-display); font-stretch: 85%; font-size: 20px; color: var(--ok); }
.done p { margin: 0; color: var(--muted); }
.summary { display: grid; gap: 14px; }
.summary h5 { margin: 0; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.summary dl { margin: 0; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); border-top: 1px solid var(--line); }
.summary dt, .summary dd { margin: 0; padding: 8px 0; border-bottom: 1px solid var(--line); }
.summary dt { color: var(--muted); font-size: 13px; padding-right: 12px; }
.summary dd { white-space: pre-wrap; overflow-wrap: anywhere; }
.summary dd.empty { color: var(--muted); }
@media (max-width: 520px) { .summary dl { grid-template-columns: 1fr; } .summary dt { border-bottom: 0; padding-bottom: 0; } }
pre.copybox { margin: 0; max-height: 220px; overflow: auto; font-size: 12px; background: var(--field); border: 1px solid var(--line); border-radius: 5px; padding: 10px; white-space: pre-wrap; }

footer .wrap { padding-block: 0 32px; color: var(--muted); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .tile { transition: none; } .tile:hover { transform: none; } }
</style>

</head>
<body>
<header>
  <div class="wrap">
    <span class="brand">Aannemingsbedrijf Wit Wognum</span>
    <h1 id="kop">Wit Wognum Portaal</h1>
    <p class="sub" id="subkop">Kies wat je wilt doen.</p>
  </div>
</header>
<div class="stripe" aria-hidden="true"></div>

<main>
  <div class="wrap" id="hub"></div>
  <div class="wrap" id="home" hidden></div>
  <div class="wrap view" id="form" hidden></div>
</main>

<footer><div class="wrap">Vragen over een formulier? Neem contact op met kantoor.</div></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>

        { id: "onveilige_situatie", label: "Omschrijving onveilige situatie", type: "keuze", opties: ["Defect aan gereedschap of materieel", "Mankement aan bouwplaats inrichting", "Mankement aan steiger of randbeveiliging"], toon: { veld: "oorzaak", bevat: "Onveilige situatie" } },
        { id: "letsel_waar", label: "Waar bevindt zich het letsel?", type: "meerkeuze", opties: ["Arm", "Been", "Hand", "Hoofd", "Oog", "Romp", "Rug", "Vinger", "Voet"], verplicht: true, hint: "Meerdere antwoorden mogelijk." },

  const req = v.verplicht && !kam ? " required" : "";
  const lab = `<label for="f-${v.id}">${esc(v.label)}${star}</label>`;
  const cond = v.toon ? ` cond" data-toon="${v.toon.veld}" data-is="${esc(v.toon.is || "")}" data-bevat="${esc(v.toon.bevat || "")}" hidden data-x="` : "";
  const hint = v.hint ? `<span class="hint">${esc(v.hint)}</span>` : "";
  let ctrl = "";
  switch (v.type) {
    case "meerkeuze":
      return `<div class="field${cond}" data-field="${v.id}" role="group" aria-labelledby="l-${v.id}">
        <span class="label" id="l-${v.id}">${esc(v.label)}${star}</span>${hint}
        <div class="choices">${v.opties.map((o, i) =>
          `<label class="choice check"><input type="checkbox" name="${v.id}" id="f-${v.id}-${i}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</div>
        <span class="err" hidden></span></div>`;
    case "keuze":
      return `<div class="field${cond}" data-field="${v.id}" role="radiogroup" aria-labelledby="l-${v.id}">
        <span class="label" id="l-${v.id}">${esc(v.label)}${star}</span>${hint}
        <div class="choices">${v.opties.map((o, i) =>
          `<label class="choice"><input type="radio" name="${v.id}" id="f-${v.id}-${i}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("")}</div>
        <span class="err" hidden></span></div>`;
    case "kort":
      ctrl = `<input type="text" id="f-${v.id}" name="${v.id}" autocomplete="off" style="max-width:240px"${req}>`; break;
    case "lijst":
      ctrl = `<select id="f-${v.id}" name="${v.id}"${req}><option value="">Kies…</option>${v.opties.map(o => `<option>${esc(o)}</option>`).join("")}</select>`; break;
    case "aantal":
      ctrl = `<input type="number" id="f-${v.id}" name="${v.id}" min="0" step="1" inputmode="numeric"${req}>`; break;
    case "persoon":
      ctrl = `<div class="person">${PERSON_ICON}<input type="text" id="f-${v.id}" name="${v.id}" list="personen" autocomplete="off" placeholder="Naam medewerker"${req}></div>`; break;
    case "tekst":
      ctrl = `<textarea id="f-${v.id}" name="${v.id}" rows="2"${req}></textarea>`; break;
    case "memo":
      ctrl = `<textarea id="f-${v.id}" name="${v.id}" rows="${v.rows || 4}"${req}></textarea>`; break;
    case "datum":
      ctrl = `<input type="date" id="f-${v.id}" name="${v.id}"${req}>`; break;
    case "foto":
      return `<div class="field upload" data-field="${v.id}">
        <span class="label">${esc(v.label)}${star}</span>
        <input type="file" id="f-${v.id}" name="${v.id}" accept="image/*" multiple>
        <label class="drop" for="f-${v.id}">＋ Foto's toevoegen</label>
        <div class="thumbs" id="thumbs-${v.id}"></div>
        <span class="err" hidden></span>
      </div>`;
  }
  return `<div class="field${cond}" data-field="${v.id}">${lab}${hint}${ctrl}<span class="err" hidden></span></div>`;
}

function itemHTML(item, kam) {
  if (item.rij) return `<div class="row2">${item.rij.map(v => veldHTML(v, kam)).join("")}</div>`;
  return veldHTML(item, kam);
}

function alleVelden(def) {
  return def.secties.flatMap(s => s.velden.flatMap(i => i.rij ? i.rij : [i]).filter(v => v.type !== "info").map(v => ({ ...v, sectie: s.titel, kam: !!s.kam })));
}

function gekozen(form, id) {
  return [...form.querySelectorAll(`input[type=checkbox][name="${id}"]:checked`)].map(i => i.value);
}

function waardeVan(form, id) {
  if (form.querySelector(`input[type=checkbox][name="${id}"]`)) return gekozen(form, id).join(", ");
  if (fotoStore[id]) return fotoStore[id].length ? `${fotoStore[id].length} foto('s)` : "";
  const el = form.elements[id];
  return el ? String(el.value || "").trim() : "";
}

function voldoet(form, veld, is, bevat) {
  if (bevat) return gekozen(form, veld).includes(bevat);
  return waardeVan(form, veld) === is;
}

function zichtbaar(form, v) {
  return !v.toon || voldoet(form, v.toon.veld, v.toon.is, v.toon.bevat);
}

function updateCond(form) {
  form.querySelectorAll(".field.cond").forEach(fld => {
    fld.hidden = !voldoet(form, fld.dataset.toon, fld.dataset.is, fld.dataset.bevat);
  });
}

function metWerkorder(def) {
  return { ...def, secties: [
    { titel: "Werkorder", velden: [
      { id: "werkorder", label: "Werkordernummer", type: "kort", verplicht: true },
    ]},
    ...def.secties,
  ]};
}

function renderForm(id, f) {
  const def = FORMS[id] ? metWerkorder(FORMS[id]) : null;
  view.style.setProperty("--c", f.kleur);
  if (!def) {
    view.innerHTML = `
      <button class="back" type="button" id="terug">‹ Terug naar overzicht</button>
      <div class="titlebar"><span class="cat">${esc(f.groep)}</span><h3>${esc(f.naam)}</h3>
      <p>De velden voor dit formulier worden in een volgende stap toegevoegd.</p></div>`;
    bindBack(); return;
  }
  fotoStore = {};
  view.innerHTML = `
    <button class="back" type="button" id="terug">‹ Terug naar overzicht</button>
    <div class="titlebar">
      <span class="cat">${esc(f.groep)}</span>
      <h3>${esc(f.naam)}</h3>
      <p>Velden met <span class="req-mark">*</span> zijn verplicht.</p>
    </div>
    ${def.melding ? `<div class="notice" role="note"><strong>Let op:</strong> ${esc(def.melding)}</div>` : ""}
    <form id="kamform" novalidate>
      ${def.secties.map(s => `
        <fieldset class="${s.kam ? "kam" : ""}">
          <legend>${esc(s.titel)}${s.kam ? `<span class="badge">In te vullen door KAM-coördinator</span>` : ""}</legend>
          ${s.velden.map(i => itemHTML(i, s.kam)).join("")}
        </fieldset>`).join("")}
      <div class="actions">
        <button class="btn primary" type="button" id="pdf">Formulier in PDF</button>
        <button class="btn ghost" type="reset" id="wissen">Alles wissen</button>
        <span class="formerr" id="formerr" role="alert" hidden></span>
        <span class="hint" id="pdf-status" role="status"></span>
      </div>
    </form>
    <datalist id="personen"></datalist>`;
  bindBack();

  const form = document.getElementById("kamform");
  form.querySelectorAll("input[type=file]").forEach(inp => {
    const fid = inp.name; fotoStore[fid] = [];
    inp.addEventListener("change", () => {
      [...inp.files].forEach(file => {
        const r = new FileReader();
        r.onload = () => { fotoStore[fid].push({ naam: file.name, url: r.result }); drawThumbs(fid); };
        r.readAsDataURL(file);
      });
      inp.value = "";
    });
  });
  form.addEventListener("input", e => {
    const fld = e.target.closest(".field");
    if (fld) { fld.classList.remove("invalid"); const er = fld.querySelector(".err"); if (er) er.hidden = true; }
  });
  form.addEventListener("change", () => updateCond(form));
  form.addEventListener("reset", () => { Object.keys(fotoStore).forEach(k => { fotoStore[k] = []; drawThumbs(k); }); setTimeout(() => updateCond(form)); });
  form.addEventListener("submit", e => { e.preventDefault(); document.getElementById("pdf").click(); });
  const pdfKnop = document.getElementById("pdf");
  pdfKnop.onclick = () => { if (valideer(def, form)) pdfOpslaan(f, def, verzamel(def, form), document.getElementById("pdf-status"), pdfKnop); };
}

function drawThumbs(fid) {
  const box = document.getElementById("thumbs-" + fid);
  if (!box) return;
  const fld = box.closest(".field");
  if (fotoStore[fid].length && fld) { fld.classList.remove("invalid"); const er = fld.querySelector(".err"); if (er) er.hidden = true; }
  box.innerHTML = fotoStore[fid].map((p, i) =>
    `<div class="thumb"><img src="${p.url}" alt="${esc(p.naam)}"><button type="button" aria-label="Foto verwijderen" data-i="${i}">×</button></div>`).join("");
  box.querySelectorAll("button").forEach(b => b.onclick = () => { fotoStore[fid].splice(+b.dataset.i, 1); drawThumbs(fid); });
}

function valideer(def, form) {
  let eerste = null, fouten = 0;
  alleVelden(def).forEach(v => {
    if (!v.verplicht || v.kam || !zichtbaar(form, v)) return;
    const fld = form.querySelector(`[data-field="${v.id}"]`);
    const el = ["keuze", "meerkeuze", "foto"].includes(v.type) ? fld.querySelector("input") : form.elements[v.id];
    const leeg = !waardeVan(form, v.id);
    fld.classList.toggle("invalid", leeg);
    const er = fld.querySelector(".err");
    if (er) { er.textContent = leeg ? "Vul dit veld in." : ""; er.hidden = !leeg; }
    if (leeg) { fouten++; eerste = eerste || el; }
  });
  const fe = document.getElementById("formerr");
  if (fouten) {
    fe.textContent = fouten === 1 ? "1 verplicht veld is nog leeg." : `${fouten} verplichte velden zijn nog leeg.`;
    fe.hidden = false; eerste.focus(); return false;
  }
  fe.hidden = true;
  return true;
}

function verzamel(def, form) {
  const nu = new Date();
  const stamp = nu.toLocaleString("nl-NL", { dateStyle: "short", timeStyle: "short" });
  const fmt = (v, val) => v.type === "datum" && val ? val.split("-").reverse().join("-") : val;
  const rows = alleVelden(def).filter(v => zichtbaar(form, v)).map(v => {
    if (v.type === "foto") return { ...v, waarde: fotoStore[v.id].length ? `${fotoStore[v.id].length} foto('s)` : "" };
    return { ...v, waarde: fmt(v, waardeVan(form, v.id)) };
  });
  const fotos = Object.values(fotoStore).flat().map(p => ({ ...p }));
  return { nu, stamp, rows, fotos };
}

function verkleinFoto(url, max = 1600) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      res({ url: c.toDataURL("image/jpeg", 0.82), w: c.width, h: c.height });
    };
    img.onerror = () => res(null);
    img.src = url;
  });
}

async function maakPdf(f, def, data) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const W = 210, H = 297, M = 16, labelW = 68, valX = M + labelW + 4, valW = W - M - valX;
  const oranje = [217, 97, 28], navy = [29, 50, 71], grijs = [91, 105, 119], lijn = [217, 223, 229];
  let y = 0;

  // Briefpapier als achtergrond op elke pagina; inhoud tussen kop (logo) en voet (adresregel)
  const TOP = 38, BOTTOM = 266;
  const achtergrond = () => doc.addImage(BRIEFPAPIER, "PNG", 0, 0, W, H, "briefpapier", "FAST");
  achtergrond();
  doc.setTextColor(...oranje); doc.setFont("helvetica", "bold"); doc.setFontSize(8.5);
  doc.text(("KAM PORTAAL  ·  " + f.groep).toUpperCase(), M, 24);
  doc.setTextColor(...navy); doc.setFontSize(20);
  doc.text(f.naam, M, 32);
  doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(...grijs);
  doc.text(`Ingevuld op ${data.stamp}`, M, 38);
  y = TOP + 10;

  const nieuwePagina = () => { doc.addPage(); achtergrond(); y = TOP + 2; };
  const ruimte = h => { if (y + h > BOTTOM) nieuwePagina(); };

  doc.setTextColor(0, 0, 0);
  def.secties.forEach(s => {
    const rijen = data.rows.filter(r => r.sectie === s.titel);
    if (!rijen.length) return;
    ruimte(16);
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...navy);
    doc.text(s.titel, M, y);
    y += 2; doc.setDrawColor(...oranje); doc.setLineWidth(0.5); doc.line(M, y, W - M, y);
    y += 5;
    rijen.forEach(r => {
      doc.setFontSize(9.5);
      doc.setFont("helvetica", "normal");
      const lab = doc.splitTextToSize(r.label, labelW);
      doc.setFont("helvetica", r.waarde ? "bold" : "normal");
      const val = doc.splitTextToSize(r.waarde || "–", valW);
      const h = Math.max(lab.length, val.length) * 4.4 + 3;
      ruimte(h);
      doc.setFont("helvetica", "normal"); doc.setTextColor(...grijs); doc.text(lab, M, y);
      doc.setFont("helvetica", r.waarde ? "bold" : "normal"); doc.setTextColor(r.waarde ? 23 : 150, r.waarde ? 34 : 160, r.waarde ? 46 : 170);
      doc.text(val, valX, y);
      y += h - 3;
      doc.setDrawColor(...lijn); doc.setLineWidth(0.2); doc.line(M, y, W - M, y);
      y += 4.5;
    });
    y += 4;
  });

  // Foto's
  if (data.fotos.length) {
    ruimte(20);
    doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(...navy);
    doc.text(`Foto's (${data.fotos.length})`, M, y);
    y += 2; doc.setDrawColor(...oranje); doc.setLineWidth(0.5); doc.line(M, y, W - M, y); y += 5;
    const gap = 6, colW = (W - 2 * M - gap) / 2, maxH = 95;
    let col = 0, rijH = 0;
    for (const p of data.fotos) {
      const img = await verkleinFoto(p.url);
      if (!img) continue;
      let w = colW, h = img.h * (colW / img.w);
      if (h > maxH) { h = maxH; w = img.w * (maxH / img.h); }
      if (col === 0) ruimte(h + 4);
      doc.addImage(img.url, "JPEG", M + col * (colW + gap), y, w, h);
      rijH = Math.max(rijH, h);
      col++;
      if (col === 2) { y += rijH + gap; col = 0; rijH = 0; }
    }
    if (col) y += rijH + gap;
  }

  // Voettekst
  const n = doc.getNumberOfPages();
  for (let i = 1; i <= n; i++) {
    doc.setPage(i);
    doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(...grijs);
    const wo = data.rows.find(r => r.id === "werkorder")?.waarde || "";
    doc.text(`${f.naam}${wo ? "  ·  werkorder " + wo : ""}`, M, 271);
    doc.text(`Pagina ${i} van ${n}`, W - M, 271, { align: "right" });
  }
  return doc.output("blob");
}

function pdfNaam(f, data) {
  const wo = data.rows.find(r => r.id === "werkorder")?.waarde || "";
  const d = data.nu, dag = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  return `${f.naam} WO ${wo} ${dag}`.replace(/[\\/:*?"<>|]+/g, "-").replace(/\s+/g, " ").trim() + ".pdf";
}

async function pdfOpslaan(f, def, data, statusEl, knop) {
  const zet = t => { if (statusEl) statusEl.textContent = t; };
  if (!window.jspdf) { zet("De PDF-functie is niet geladen. Controleer de internetverbinding en herlaad de pagina."); return; }
  knop.disabled = true; zet("PDF wordt gemaakt…");
  const actions = knop.closest(".actions");
  actions.parentNode.querySelectorAll(".pdfpanel").forEach(p => p.remove());
  try {
    const blob = await maakPdf(f, def, data);
    const naam = pdfNaam(f, data);
    const file = new File([blob], naam, { type: "application/pdf" });
    const kanDelen = !!(navigator.canShare && navigator.canShare({ files: [file] }));
    const panel = document.createElement("div");
    panel.className = "pdfpanel";
    panel.innerHTML = `
      <div class="pdfinfo"><strong>PDF klaar</strong><span>${esc(naam)} · ${Math.max(1, Math.round(blob.size / 1024))} kB</span></div>
      <div class="actions">
        ${kanDelen ? `<button class="btn primary" type="button" data-act="delen">PDF delen</button>` : ""}
        <button class="btn ${kanDelen ? "ghost" : "primary"}" type="button" data-act="download">PDF downloaden</button>
      </div>
      <span class="hint" role="status"></span>`;
    actions.after(panel);
    const pst = panel.querySelector("[role=status]");
    panel.querySelector('[data-act="download"]').onclick = () => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = naam; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 60000);
      pst.textContent = "PDF gedownload.";
    };
    const dk = panel.querySelector('[data-act="delen"]');
    if (dk) dk.onclick = async () => {
      try {
        await navigator.share({ files: [file], title: naam.replace(/\.pdf$/, ""), text: `${f.naam} – ingevuld ${data.stamp}` });
        pst.textContent = "PDF gedeeld.";
      } catch (e) {
        pst.textContent = e && e.name === "AbortError" ? "Delen geannuleerd." : "Delen lukte niet. Gebruik PDF downloaden.";
      }
    };
    zet("");
    panel.scrollIntoView({ block: "nearest", behavior: "smooth" });
  } catch (e) {
    zet("De PDF kon niet worden gemaakt.");
  } finally { knop.disabled = false; }
}

function submit(id, f, def, form) {
  if (!valideer(def, form)) return;
  const data = verzamel(def, form);
  const { stamp, rows } = data;

  const tekst = [`${f.naam} — ingediend ${stamp}`, ""].concat(
    def.secties.flatMap(s => [s.titel.toUpperCase()].concat(
      rows.filter(r => r.sectie === s.titel).map(r => `${r.label}: ${r.waarde || "-"}`), [""]))).join("\n");

  view.innerHTML = `
    <button class="back" type="button" id="terug">‹ Terug naar overzicht</button>
    <div class="titlebar"><span class="cat">${esc(f.groep)}</span><h3>${esc(f.naam)}</h3></div>
    <div class="done">
      <h4>Formulier ingevuld</h4>
      <p>Het formulier wordt niet automatisch verstuurd. Maak een PDF en deel die met kantoor, of kopieer de tekst.</p>
      <div class="summary">
        ${def.secties.map(s => `<div><h5>${esc(s.titel)}</h5><dl>
          ${rows.filter(r => r.sectie === s.titel).map(r => `<dt>${esc(r.label)}</dt><dd class="${r.waarde ? "" : "empty"}">${esc(r.waarde || "–")}</dd>`).join("")}
        </dl></div>`).join("")}
      </div>
      <pre class="copybox" id="copybox">${esc(tekst)}</pre>
      <div class="actions">
        <button class="btn primary" type="button" id="pdf-done">Formulier in PDF</button>
        <button class="btn ghost" type="button" id="kopieer">Tekst kopiëren</button>
        <button class="btn ghost" type="button" id="nieuw">Nieuw formulier</button>
        <span class="hint" id="kopieer-status" role="status"></span>
      </div>
    </div>`;
  bindBack();
  document.getElementById("nieuw").onclick = () => renderForm(id, f);
  const pdfDone = document.getElementById("pdf-done");
  pdfDone.onclick = () => pdfOpslaan(f, def, data, document.getElementById("kopieer-status"), pdfDone);
  document.getElementById("kopieer").onclick = () => {
    const st = document.getElementById("kopieer-status");
    const sel = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById("copybox")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); st.textContent = "Tekst geselecteerd, kopieer met Ctrl+C."; };
    try { navigator.clipboard.writeText(tekst).then(() => st.textContent = "Gekopieerd.", sel); } catch (_) { sel(); }
  };
  window.scrollTo(0, 0);
}

function bindBack() {
  document.getElementById("terug").onclick = () => { location.hash = "kam"; };
}

const KAM_SUB = "Meldingen, inspecties en overleggen voor Kwaliteit, Arbo en Milieu. Kies het formulier dat je wilt invullen.";
function zetKop(titel, sub) {
  document.getElementById("kop").textContent = titel;
  document.getElementById("subkop").textContent = sub;
  document.title = titel;
}

function render() {
  const id = location.hash.slice(1);
  hub.hidden = true; home.hidden = true; view.hidden = true;
  const h = HUB.find(x => x.id === id);
  if (id === "kam") {
    zetKop("Wit Wognum Kam Portaal", KAM_SUB); home.hidden = false;
  } else if (lookup[id]) {
    zetKop("Wit Wognum Kam Portaal", KAM_SUB); renderForm(id, lookup[id]); view.hidden = false;
  } else if (h && h.binnenkort) {
    zetKop("Wit Wognum Portaal", "Kies wat je wilt doen.");
    view.style.setProperty("--c", h.kleur);
    view.innerHTML = `<button class="back" type="button" id="terug-start">‹ Terug naar start</button>
      <div class="titlebar"><h3>${esc(h.naam)}</h3><p>Deze functie is binnenkort beschikbaar.</p></div>`;
    document.getElementById("terug-start").onclick = () => { location.hash = ""; };
    view.hidden = false;
  } else {
    zetKop("Wit Wognum Portaal", "Kies wat je wilt doen."); hub.hidden = false;
  }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);
render();
</script>

</body>
</html>
